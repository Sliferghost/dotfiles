# Enable IPC for controlling hyprpaper with hyprctl
ipc = on

# Disable the hyprpaper splash screen
splash = false

# Preload the wallpaper into memory for faster switching
# IMPORTANT: Replace this path with the actual path to your wallpaper on Arch
preload = ~/Images/Backgrounds/Rainnight.jpg

# Set the wallpaper for a specific monitor
# IMPORTANT: Replace HDMI-A-1 if your monitor has a different name
# You can find your monitor names by running `hyprctl monitors`
wallpaper = HDMI-A-1,~/Images/Backgrounds/Rainnight.jpg
