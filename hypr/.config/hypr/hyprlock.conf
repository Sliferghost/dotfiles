# ~/.config/hypr/hyprlock.conf
# This configuration was translated from a Nix Home-Manager module.

# DEFINE YOUR COLORS AND VARIABLES HERE
# NOTE: The original config used variables like $mauve, $base, etc.
# You must define these yourself. Below are placeholders based on the Catppuccin theme.
$accent = rgba(cba6f7ff)
$accentAlpha = rgba(cba6f7aa)
$font = JetBrainsMono Nerd Font

$base = rgba(1e1e2eff)
$surface0 = rgba(303446ff)
$text = rgba(cad3f5ff)
$textAlpha = rgba(cad3f5aa)
$red = rgba(f38ba8ff)
$yellow = rgba(f9e2afff)
# -------------------------------------

general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor = HDMI-A-1
    path = ~/Images/Backgrounds/Rainnight.jpg
    blur_passes = 0
    color = $base
}

label {
    # TIME
    monitor = HDMI-A-1
    text = $TIME
    color = $text
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

label {
    # DATE
    monitor = HDMI-A-1
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = $text
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

image {
    # USER AVATAR
    monitor = HDMI-A-1
    path = ~/Images/Avatars/catppuccin-avatar.png
    size = 100
    border_color = $accent
    position = 0, 75
    halign = center
    valign = center
}

input-field {
    monitor = HDMI-A-1
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##cad3f5aa"><i>󰌾 Logged in as </i></span><span foreground="##cba6f7aa">$USER</span>
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, -47
    halign = center
    valign = center
}
